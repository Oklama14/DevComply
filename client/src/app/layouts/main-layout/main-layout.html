<div class="main-layout-container">
  <!-- Celular: barra superior com o botao do menu (a barra lateral vira gaveta) -->
  <header class="mobile-topbar" data-testid="mobile-topbar">
    <button type="button" class="icon-btn" data-testid="menu-open" (click)="abrirMenu()"
            aria-label="Abrir menu" aria-controls="app-sidebar" [attr.aria-expanded]="menuAberto">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="topbar-logo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      DevComply
    </span>
    <button type="button" class="icon-btn" data-testid="theme-toggle-mobile" (click)="theme.alternar()"
            [attr.aria-label]="theme.escuro() ? 'Usar tema claro' : 'Usar tema escuro'">
      <ng-container *ngTemplateOutlet="iconeTema"></ng-container>
    </button>
  </header>

  <div class="sidebar-overlay" *ngIf="menuAberto" (click)="fecharMenu()" aria-hidden="true"></div>

  <!-- Barra de Navegação Lateral -->
  <nav class="sidebar" id="app-sidebar" data-testid="sidebar" [class.open]="menuAberto" aria-label="Menu principal">
    <div class="sidebar-header">
      <!-- Logótipo SVG -->
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-icon">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="logo-text">DevComply</span>
      <button type="button" class="icon-btn sidebar-close" data-testid="menu-close" (click)="fecharMenu()" aria-label="Fechar menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <ul class="nav-list">
      <li>
        <a routerLink="/dashboard" data-testid="nav-dashboard" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a routerLink="/projects" data-testid="nav-projects" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/><path d="m16 14 4 4m0-4-4 4"/></svg>
          <span>Projetos</span>
        </a>
      </li>
      <li>
        <a routerLink="/checklist" data-testid="nav-checklist" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Checklist LGPD</span>
        </a>
      </li>
      <li>
        <a routerLink="profile" data-testid="nav-profile" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 1 0 0 8Z M5 21a7 7 0 0 1 14 0H5Z
"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Perfil</span>
        </a>
      </li>

      <li>
        <a routerLink="settings" data-testid="nav-settings" routerLinkActive="active" class="nav-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 0 2l-.15.08a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1 0-2l.15-.08a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Configurações</span>
        </a>
      </li>
    </ul>

    <!-- Secção de Logout no rodapé da barra lateral -->
    <div class="sidebar-footer">
      <!-- Transparencia: sempre a um clique de qualquer tela do sistema -->
      <div class="legal-box" data-testid="nav-legal">
        <a routerLink="/profile" fragment="seus-dados" class="legal-main" data-testid="nav-seus-dados">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          Como usamos seus dados
        </a>
        <div class="legal-links">
          <a href="/termos-uso" target="_blank" rel="noopener" title="Abre em nova aba" data-testid="nav-termos">Termos de Uso</a>
          <span aria-hidden="true">·</span>
          <a href="/politica-privacidade" target="_blank" rel="noopener" title="Abre em nova aba" data-testid="nav-privacidade">Privacidade</a>
        </div>
      </div>

      <button type="button" (click)="theme.alternar()" data-testid="theme-toggle" class="nav-link"
              [attr.aria-label]="theme.escuro() ? 'Usar tema claro' : 'Usar tema escuro'">
        <ng-container *ngTemplateOutlet="iconeTema"></ng-container>
        <span>{{ theme.escuro() ? 'Tema claro' : 'Tema escuro' }}</span>
      </button>

      <button (click)="logout()" data-testid="nav-logout" class="nav-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        <span>Sair</span>
      </button>
    </div>
  </nav>

  <!-- Conteúdo Principal -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

<!-- Icone do botao de tema: lua no claro (vai para o escuro), sol no escuro -->
<ng-template #iconeTema>
  <svg *ngIf="!theme.escuro()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  <svg *ngIf="theme.escuro()" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
</ng-template>
