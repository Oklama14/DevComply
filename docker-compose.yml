# Os valores sensiveis vem de um arquivo .env nao versionado, ao lado deste
# arquivo. A sintaxe ${VAR:?mensagem} faz o compose falhar com um erro claro quando
# a variavel nao esta definida, em vez de subir com um valor de exemplo.
#
# Copie api/.env.example para .env, defina os valores, e nao commite o .env.

services:
  postgres:
    image: postgres:13
    container_name: devcomply_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devcomply-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: devcomply_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Os nomes abaixo sao os que app.module.ts realmente le. Antes daqui o compose
      # definia DB_USERNAME e DB_PASSWORD, que a aplicacao nunca consultou — a
      # conexao so funcionava por causa do DATABASE_URL, que por sua vez estava
      # malformado (a senha continha @, quebrando a URL).
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:?defina POSTGRES_USER no .env}
      - DB_PASS=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - DB_NAME=${POSTGRES_DB:?defina POSTGRES_DB no .env}
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:?defina APP_ENCRYPTION_KEY no .env}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devcomply-network
    command: npm run start:dev

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: devcomply_client
    restart: always
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - api
    networks:
      - devcomply-network
    command: ng serve --host 0.0.0.0 --port 4200

volumes:
  postgres_data:
  api_node_modules:
  client_node_modules:

networks:
  devcomply-network:
    driver: bridge
